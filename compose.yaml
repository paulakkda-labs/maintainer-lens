name: maintainer-lens

# Application connection strings use Docker service DNS names; host-mode
# DATABASE_URL / RABBITMQ_URL in .env still use localhost.
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/${RABBITMQ_VHOST:?RABBITMQ_VHOST is required}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

# Container-local retention, not a centralized or time-based log archive.
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Non-secret execution identity must agree between URL resolution and the Worker.
x-investigation-profile-env: &investigation-profile-env
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  LLM_REVIEW_MAX_OUTPUT_TOKENS: ${LLM_REVIEW_MAX_OUTPUT_TOKENS:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.6-pg17

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.2-management-alpine
    hostname: maintainer-lens-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?RABBITMQ_VHOST is required}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs migrations exactly as a one-off service, before API/worker startup.
  migrate:
    build: *app-build
    image: maintainer-lens:dev
    logging: *app-logging
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *app-build
    image: maintainer-lens:dev
    logging: *app-logging
    command: ["uvicorn", "maintainer_lens.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*app-env, *investigation-profile-env]
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on: &app-dependencies
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dispatcher:
    build: *app-build
    image: maintainer-lens:dev
    logging: *app-logging
    command: ["python", "-m", "maintainer_lens.outbox_dispatcher"]
    environment: *app-env
    restart: unless-stopped
    depends_on: *app-dependencies

  worker:
    build: *app-build
    image: maintainer-lens:dev
    logging: *app-logging
    command: ["python", "-m", "maintainer_lens.worker"]
    environment:
      <<: [*app-env, *investigation-profile-env]
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MAX_BATCH_SIZE: ${EMBEDDING_MAX_BATCH_SIZE:-20}
      EMBEDDING_REQUEST_DIMENSIONS: ${EMBEDDING_REQUEST_DIMENSIONS:-}
    restart: unless-stopped
    depends_on: *app-dependencies

volumes:
  postgres_data:
  rabbitmq_data:
