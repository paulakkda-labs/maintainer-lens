[project]
name = "maintainer-lens"
version = "0.1.0"
license = "Apache-2.0"
description = "An evidence-driven, multi-agent GitHub issue investigation platform."
readme = "README.md"
authors = [
    { name = "paul", email = "11828515+paulakkda-labs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "markdown-it-py>=4.2.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]
unfixable = ["F401"]
